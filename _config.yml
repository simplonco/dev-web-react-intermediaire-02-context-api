remote_theme: simplonco/simplonline-ressources-jekyll-theme

title: "React Intermédiaire 02 - Context API"
description: "Ressource sur l'utilisation du Context API dans React pour partager des données entre composants."
github_org: simplonco
lang: fr

show_toc: true

readme_index:
  with_frontmatter: true

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true

defaults:
  - scope:
      path: ""
    values:
      layout: default

plugins:
  - jekyll-readme-index
  - jekyll-remote-theme
  - jekyll-stepper
